name: B44-04 account lifecycle safety
on:
  pull_request:
    branches: [feat/build44-ai-consent-backend]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Full Worker, SQLite, account lifecycle, AI and restore regressions
        run: npm test
